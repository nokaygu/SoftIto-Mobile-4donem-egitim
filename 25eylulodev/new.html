<!--tarayıcıya modern html kullan der -->
<!doctype html>
<html lang="tr">
    <!--başlık karakter kodlaması css bilgileri verilir -->
    <head>
        <meta charset="UTF-8" />
        <!--scale uzaklaştırma yakınlaştırma olmadan başla ekranın  genişliği kadar genişlik -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--sekmedeki başlık -->
        <title>Sipariş Gelir Gider</title>
       <!-- css kuralları-->
      <style>
 /*her yerde kulanılabilir css değişkenleri*/
      :root {
        --bg: #f8f7f4;
        --card: #ffffff;
        --border: #e6e5df;
        --text: #181716;
        --muted: #6b6963;
        --clay: #c85a32;
        --clay-hover: #b04e29;
        --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
/* border box ile taşma önle margin 0 padding 0 ile dışardan gelebilcek etkilemeyi sıfırla*/
      *,
      *::before,
      *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--text); font-family: var(--font-main); padding: 36px 16px; line-height: 1.5; }
      .kokpit { max-width: 960px; margin: 0 auto; }

      /* Header & KPI */
      .header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
      .header__tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--clay); font-weight: 700; }
      .header__title { font-size: 26px; font-weight: 700; margin-top: 2px; }
    /* üçlü eşit grid oluşturur */
      .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
      .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; }
      .kpi-card span { font-size: 12px; color: var(--muted); font-weight: 600; }
      .kpi-card h3 { font-size: 22px; font-weight: 700; font-family: var(--font-mono); margin-top: 4px; }

      /* Layout */
      .layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
      @media (max-width: 768px) { .layout, .kpi-grid { grid-template-columns: 1fr; } }

      /* Form & Panel */
      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
      .panel h4 { font-size: 15px; font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

      .field { margin-bottom: 12px; }
      .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
     .field input, .field select, .filter-bar__search { width: 100%; padding: 8px 10px; font-size: 13px; font-family: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
      .field input:focus, .field select:focus, .filter-bar__search:focus { outline: none; border-color: var(--clay); background: #fff; }

      .btn-submit { width: 100%; background: var(--clay); color: #fff; border: none; padding: 10px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 6px; }
      .btn-submit:hover { background: var(--clay-hover); }

      /* Liste & Filtre  */
      .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; }
      /* flexbox ile yan yana yerleştirme(sütunlar)*/
      .order-list { display: flex; flex-direction: column; gap: 10px; }

      .order-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
      .order-item h5 { font-size: 13px; font-weight: 600; }
      .order-item p { font-size: 12px; color: var(--muted); }
      /* itemleri ortala*/
      .meta-box { display: flex; align-items: center; gap: 10px; }
      .badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; background: #fef3c7; color: #92400e; font-family: var(--font-mono); }
      .badge--mobilya { background: #e0e7ff; color: #3730a3; }
      .badge--aydinlatma { background: #fef3c7; color: #b45309; }
      .badge--mutfak { background: #d1fae5; color: #065f46; }

      .btn-del { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
      .btn-del:hover { background: #ef4444; color: #fff; border-color: #ef4444; }
      .filter-bar__search {
          margin-bottom: 0;
      }

      .filter-bar__category {
          width: 130px;
          font-size: 12px;
          padding: 6px;
      }

      .order-list__empty {
          padding: 24px;
          text-align: center;
          color: var(--muted);
          font-size: 12px;
      }
      </style>

    </head>
    <!--görünen kısmın başlangıcı -->
    <body>
        <div class="kokpit">
            <!--ekranın üstünde görünen başlık -->
            <header class="header">
                <span class="header__tag">Sipariş Takip</span>
                <h1 class="header__title">Sipariş Yönetim Kokpiti</h1>
            </header>
        </div>
        <!--başlığın altındaki üçlü css tarafıdna eşit olduklarnı vermiştik -->
        <section class="kpi-grid">
            <div class="kpi-card">
                <span>Kayıtlı Sipariş</span>
                <h3 id="kpiCount">0</h3>
            </div>
            <div class="kpi-card">
                <span>Toplam Sipariş Tutar</span>
                <h3 id="kpiTotal">0 TL</h3>
            </div>
            <div class="kpi-card">
                <span>Ortalama Ürün Fiyatı</span>
                <h3 id="kpiAvg">0 TL</h3>
            </div>
        </section>
        <!--ana içerik -->
        <main class="layout">
            <!--soldaki form paneli -->
            <section class="panel">
                <h4>Yeni sipariş kaydı</h4>
                <!--sipariş formu -->
                <form id="orderForm">
                    <div class="field">
                        <!-- altındaki inputun idsine göre label etiket-->
                        <label for="prodName">Ürün Adı</label>
                        <input
                            type="text"
                            id="prodName"
                            placeholder="Sehpa"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="prodCat">Kategori</label>
                        <!--seçim yapıyoruz -->
                        <select name="prodCat" id="prodCat">
                            <option value="Mobilya">Mobilya</option>
                            <option value="Aydınlatma">Aydınlatma</option>
                            <option value="Mutfak">Mutfak</option>
                        </select>
                    </div>
                    <!-- fiyat giriyoruz-->
                    <div class="field">
                        <label for="prodPrice">Fiyat</label>
                        <input
                            type="number"
                            id="prodPrice"
                            value="32550"
                            min="100"
                            step="1"
                            required
                        />
                        <!--stepi bir yaptım istediğim sayıyı veremiyordum -->
                    </div>
                    <!-- sipariş kaydet özelliği-->
                    <button type="submit" class="btn-submit">
                        Siparişi Kaydet
                    </button>
                </form>
            </section>
            <section class="panel">
                <!--filtreleme yapıyoruz -->
                <div class="filter-bar">
                    <input
                        type="text"
                        id="searchInput"
                       class="field filter-bar__search"
                        placeholder="Ürün adına göre filtrele"
                    />
                    <select
                        id="categoryFilter"
                      class="filter-bar__category"
                    >
                        <option value="ALL">Tüm Kategoriler</option>
                        <option value="Mobilya">Mobilya</option>
                        <option value="Aydınlatma">Aydınlatma</option>
                        <option value="Mutfak">Mutfak</option>
                    </select>
                </div>
                <div id="orderContainer" class="order-list">
                    <!--dinamik olarak elemanlar buraya baılcak eklencek -->
                </div>
            </section>
        </main>
        <script>
        //siparişler dizisi
            let orders=[
              {id:1,name:"Sehpa",category:"Mobilya",price:6500},
              {id:2,name:"Abajur",category:"Aydınlatma",price:7500},
              {id:3,name:"Koltuk",category:"Mobilya",price:8500},
              {id:4,name:"Bulaşık Makinesi",category:"Mutfak",price:10000},
              {id:5,name:"Ocak",category:"Mutfak",price:15000},
            ]
            //dom elementleri toplayalım
            const orderContainer=document.getElementById(`orderContainer`);
               const orderForm=document.getElementById(`orderForm`);
            const searchInput=document.getElementById(`searchInput`);
            const categoryFilter=document.getElementById(`categoryFilter`);
            //kpi dediği üstteki üçlü ortalanan grid toplam ortalama fiyat buluyor
            const kpiCount=document.getElementById(`kpiCount`);
            const kpiTotal=document.getElementById(`kpiTotal`);
            const kpiAvg=document.getElementById(`kpiAvg`);
            //ürün adı
            const prodName = document.getElementById("prodName");
            //ürün kategori
            const prodCat = document.getElementById("prodCat");
            //ürün fiyat cellerimizi oluşturacağız
            const prodPrice = document.getElementById("prodPrice");
            //hücreleri güncelleyecek fonksiyon
            const updateKPIS=(dataList)=>{
              //kayıtlı sipariş sayısı kadar dizideki cell kadar
              kpiCount.textContent=dataList.length;
              //boş dizi gelirse ürün yok demek sıfırla
              if(dataList.length===0){
                kpiTotal.textContent="0 TL";
                kpiAvg.textContent="0 TL";
                return;
              }
              //tüm cellerin price değerleri topluyor
                //toplam tutar v(.reduce)
                const total=dataList.reduce((acc,curr)=>acc+curr.price,0)
                kpiTotal.textContent=`${total.toLocaleString("tr-TR")} TL`;
                  //toplam fiyatı cell sayısına böldük cell başı ortalama fiyat
                //ortalama fiyat reduce
                const avg=total / dataList.length;
                kpiAvg.textContent=`${Math.round(avg).toLocaleString("tr-TR")} TL`;
            }
            //siparişleri renderle
            const renderOrders=()=>{
              //girilen aranan kelime
              const term = searchInput.value.toLocaleLowerCase("tr-TR").trim();
              //seçilen kategoriyi filtreliden bul
              const selectedCat=categoryFilter.value;

              //filtreleme bölümü
              const filtered=orders.filter(order=>{
                const matchesName = order.name
                    .toLocaleLowerCase("tr-TR")
                    .includes(term);
                const matchesCategory=selectedCat==="ALL"||order.category===selectedCat;
                return matchesName && matchesCategory;
              })
              //filtered boşsa celleri güncelleyip buradan çıkıyoruz burası önemli
              orderContainer.innerHTML="";
              if(filtered.length===0){
                orderContainer.innerHTML=`
                  <div class="order-list__empty">
                  kriterlere uygun ürün bulunamadı
                  </div>
                  `;
                updateKPIS([]);
                return;
              }
              //dinamik eleemnt üretim
              filtered.forEach(order=>{
                const item=document.createElement("article");
                item.className="order-item";
                item.setAttribute("data-id",order.id);
                const badgeClass =
                    order.category === "Mobilya"
                        ? "badge--mobilya"
                        : order.category === "Aydınlatma"
                          ? "badge--aydinlatma"
                          : "badge--mutfak";
                item.innerHTML=`
                  <div>
                  <h5></h5>
                  <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")}TL</p>
                  </div>
                  <div class="meta-box">
                  <span class="badge ${badgeClass}">${order.category}</span>
                  <button class="btn-del"
                  data-action="delete">Sil</button>
                  </div>
                  `;
                orderContainer.appendChild(item);
                //burada sipariş ismi setlerken html kaçmasını engelledik
                item.querySelector("h5").textContent = order.name;
              })
              updateKPIS(filtered);
//uppdatekpis foreach içinde olmasına gerek yok  en son çalışıp ekranı güncelleyeblir

            }
            orderForm.addEventListener("submit", (event) => {
                // Formun sayfayı yenilemesini engelle.
                event.preventDefault();

                const name = prodName.value.trim();
                const category = prodCat.value;
                const price = Number(prodPrice.value);

                // Sadece boşluk yazılmışsa kayıt oluşturma.
                if (name === "") {
                    alert("Lütfen ürün adını gir.");
                    prodName.focus();
                    return;
                }

                // Mevcut HTML kurallarına uygun fiyat kontrolü.
                if (!Number.isInteger(price) || price < 100) {
                    alert("Fiyat en az 100 TL ve tam sayı olmalı.");
                    prodPrice.focus();
                    return;
                }

                // Mevcut en büyük kimliğin bir fazlasını kullan.
                const id = orders.reduce(
                    (maxId, order) => Math.max(maxId, order.id),
                    0
                ) + 1;

                orders.push({
                    id,
                    name,
                    category,
                    price,
                });

                // Formu başlangıç değerlerine döndür.
                orderForm.reset();

                // Yeni siparişin görünmesi için filtreleri temizle.
                searchInput.value = "";
                categoryFilter.value = "ALL";

                renderOrders();
            });
            orderContainer.addEventListener("click", (event) => {
                // Tıklanan yer bir silme butonu mu?
                const deleteButton = event.target.closest(
                    'button[data-action="delete"]'
                );

                if (!deleteButton) {
                    return;
                }

                // Butonun bulunduğu sipariş kartını bul.
                const item = deleteButton.closest(".order-item");

                // HTML'den okunan kimliği sayıya dönüştür.
                const id = Number(item.dataset.id);

                // Bu kimlik dışındaki kayıtları tut.
                orders = orders.filter(order => order.id !== id);

                renderOrders();
            });
            searchInput.addEventListener("input",renderOrders);
            categoryFilter.addEventListener("change",renderOrders);
            renderOrders();
        </script>
    </body>
</html>
