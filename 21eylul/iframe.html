<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iframe</title>
</head>
<style>
body{
    font-family: 'Courier New',Courier,monospace;
    background: khaki;
    padding:20px;
    max-width: 600px;
    margin:auto;
}
.card{
    background-color:blueviolet;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 52px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
h3{
    margin-top:0;
    color:#1e293b;
}
iframe{
    width:100%;
    border-radius:8px;
    border:none;
}
</style>
<body>
<div class="card"><iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
<div class="card"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d97485.85005996618!2d29.0322895!3d40.221678!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14ca1582d8d45695%3A0x61a00555fc973392!2sBursa!5e0!3m2!1skm!2str!4v1789995766892!5m2!1skm!2str" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
</body>
</html>
